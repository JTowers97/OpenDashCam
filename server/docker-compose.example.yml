# Copy this file to docker-compose.yml and edit it. Updates never overwrite your docker-compose.yml.
#
# Start the server:                         docker compose up -d --build
# Start it with smart search (optional ML): docker compose --profile ml up -d --build
# Add automatic HTTPS (Let's Encrypt):      docker compose --profile https up -d --build
# Several optional parts at once:           docker compose --profile ml --profile https up -d --build
#   (or put COMPOSE_PROFILES=ml,https in a .env file next to this one and just run docker compose up -d --build)
services:
  opendashcam:
    build: .
    # Or, once the "Server" GitHub workflow has published an image, use it instead of `build`:
    # image: ghcr.io/YOUR_GITHUB_USERNAME/opendashcam-server:latest
    container_name: opendashcam
    restart: unless-stopped
    ports:
      # HOST:CONTAINER. Change the left number to use another port; keep 8080 on the right.
      - "8080:8080"
      # Built-in HTTPS (the server's own certificate; phones trust it automatically after pairing).
      - "8443:8443"
    environment:
      # The address PHONES use to reach the server; it goes into the pairing QR code.
      # On your home network, use this computer's LAN IP, e.g. http://192.168.1.50:8080
      # For access from anywhere, put it behind HTTPS and use e.g. https://opendashcam.example.com
      - ODC_PUBLIC_URL=http://192.168.1.50:8080
      # Optional: the server's address on your home network. Phones on your home Wi-Fi use it automatically
      # (faster uploads). Using the built-in HTTPS port keeps it encrypted, e.g. https://192.168.1.50:8443
      # (can also be set in Settings → Security).
      # - ODC_HOME_URL=https://192.168.1.50:8443
      # Set to 1 only when running behind a reverse proxy.
      - ODC_TRUST_PROXY=0
      - TZ=America/New_York
      # Where the optional ML service is (only used when smart search is turned on in Settings).
      - ODC_ML_URL=http://opendashcam-ml:3003
    volumes:
      # Database, footage and caches. Back this folder up.
      - ./data:/data

  # Optional: smart search ("red pickup truck", "bridge", "snow"). Analyzes footage on this machine
  # with the CLIP model. Needs about 1.5 GB of RAM; the model (~600 MB) downloads on first start.
  # Started only with: docker compose --profile ml up -d --build
  opendashcam-ml:
    profiles: ["ml"]
    build: ./ml
    container_name: opendashcam-ml
    restart: unless-stopped
    environment:
      # CPU threads to use for analysis (default: half the CPU cores).
      # - ODC_ML_THREADS=2
      - TZ=America/New_York
    volumes:
      - ./ml-cache:/cache
    # No ports: only the ODC server talks to it, over Docker's internal network.

  # Optional: automatic HTTPS with a free, publicly trusted Let's Encrypt certificate (renewed automatically).
  # Needs a domain name whose DNS points to your public IP, and ports 80 and 443 forwarded to this machine.
  # Then set ODC_PUBLIC_URL above to https://<your domain> and ODC_TRUST_PROXY=1.
  # Started only with: docker compose --profile https up -d
  caddy:
    profiles: ["https"]
    image: caddy:2
    container_name: opendashcam-https
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ODC_DOMAIN=odc.example.com
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys. Keep this folder so certificates aren't requested again on every start.
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      - opendashcam
